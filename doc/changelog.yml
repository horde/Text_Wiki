  notes: |-
    fix: Convert some leftover class names
    Misnamed variable
    fix: Enable UTF-8 mode by default and port regex improvements from the internalized version in horde/wicked
    chore: Remove addPath as it's no longer useful
    fix: Remove require_once and repair wrong base class name
    Allow optionally setting an explicit rule name for a parser rule object
    feat: Be more defensive when parsing wiki rules
    Add InvalidArgumentException import
    Start importing mediawiki tests
    chore: Bulk remove call-by-reference on process()
    feat: Fix mapping between class names and rule/format strings. Import fixtures from old tests/ dir.
    Add basic exception test
    Add placeholder test to demonstrate PHPUnit 12 test suite passing
    feat: Add final generic exception class derived from DomainException, marker interface and CI boilerplate for unit tests
    More minor CS fixes
    fix: Change format object loader to align with new naming scheme
    chore: Rename classes to match new filesystem structure. Fix string access {} to []. Apply php-cs-fixer
    chore: PSR4 namespace, rename and move files
    fix: Rename root base class to TextWiki, namespace, remove require_once statements. Fix curly braces {} string access to []
    build: composer.json file now identifies as horde/text_wiki rather than pear/text_wiki
    refactor: Move library code to canonical src/ dir
    Create README.md
